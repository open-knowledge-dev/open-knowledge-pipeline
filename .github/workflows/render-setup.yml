name: Render Table Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Create tables on Render
        env:
          RENDER_DB_URL: ${{ secrets.RENDER_DB_URL }}
        run: python render_setup.py
