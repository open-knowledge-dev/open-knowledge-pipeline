name: Import Pending Files

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Import pending files
        env:
          TRAINING_FORM_URL: ${{ secrets.TRAINING_FORM_URL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python import_pending.py
