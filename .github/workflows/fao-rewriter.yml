name: FAO Safety-Net Rewriter

on:
  schedule:
    # Every Sunday at 4:00 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      max_files:
        description: 'Maximum files to process'
        required: false
        default: '10'

jobs:
  fao-rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests psycopg2-binary
      
      - name: Run FAO Rewriter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KNOWLEDGE_REPO: ${{ secrets.KNOWLEDGE_REPO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NEON_URL: ${{ secrets.NEON_URL }}
          FLY_PG_URL: ${{ secrets.FLY_PG_URL }}
        run: python fao_rewriter.py
      
      - name: Summary
        run: |
          echo "✅ FAO Rewriter complete."
          echo "Check admin/fao-rewrite-audit.md for details."
