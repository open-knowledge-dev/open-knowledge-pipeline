name: Issue Rewriter

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (true/false)'
        required: false
        default: 'false'
      max_files:
        description: 'Maximum files to process'
        required: false
        default: '27'

jobs:
  rewrite-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run issue rewriter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KNOWLEDGE_REPO: ${{ secrets.KNOWLEDGE_REPO }}
          TRAINING_FORM_URL: ${{ secrets.TRAINING_FORM_URL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          CI: true
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_FILES: ${{ github.event.inputs.max_files || '27' }}
        run: python issue_rewriter.py
