name: Cloudflare AI - Qwen

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r cloudflare_worker/requirements.txt

      - name: Run Cloudflare Qwen Scraper
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MODEL: "@cf/qwen/qwen3-30b-a3b-fp8"
          SCRAPER_CATEGORY: "education"
          ENTRIES_PER_RUN: "10"
          MIN_WORDS: "400"
          MAX_TOKENS: "1500"
        run: python cloudflare_worker/scraper.py

      - name: Commit generated files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending/
          git diff --staged --quiet || git commit -m "Cloudflare Qwen: $(date +%Y-%m-%d)"
          git push
