name: Metadata Audit

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run metadata audit batch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KNOWLEDGE_REPO: ${{ secrets.KNOWLEDGE_REPO }}
          AUDIT_BATCH_SIZE: "500"
        run: python metadata_audit.py

      - name: Summary
        run: |
          echo "✅ Metadata audit batch complete."
          echo "Report: admin/metadata_report.md"
          echo "Progress: admin/audit-progress.json"
