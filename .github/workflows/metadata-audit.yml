name: Metadata Audit

on:
  schedule:
    # Every Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run metadata audit
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KNOWLEDGE_REPO: ${{ secrets.KNOWLEDGE_REPO }}
        run: python metadata_audit.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: metadata-audit-report
          path: |
            metadata_report.json
            metadata_report.md
          retention-days: 90

      - name: Summary
        run: |
          echo "✅ Metadata audit complete."
          echo "Check the artifacts for the full report."
