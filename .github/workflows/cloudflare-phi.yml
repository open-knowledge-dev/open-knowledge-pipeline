name: Cloudflare AI - Phi-3

on:
  schedule:
    - cron: '0 10 * * *'  # 10 AM UTC daily
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r cloudflare_worker/requirements.txt
          
      - name: Run Cloudflare Phi-3 Scraper
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MODEL: "@cf/microsoft/phi-3-mini-4k-instruct"
          SCRAPER_CATEGORY: "general"
          ENTRIES_PER_RUN: "10"
        run: python cloudflare_worker/scraper.py
        
      - name: Commit generated files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending/
          git diff --staged --quiet || git commit -m "Cloudflare Phi-3: $(date +%Y-%m-%d)"
          git push
