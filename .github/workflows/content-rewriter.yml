name: Content Rewriter — Banned Organization Cleanup

on:
  schedule:
    # Every Sunday at 4:00 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      max_files:
        description: 'Maximum files to process'
        required: false
        default: '10'
      dry_run:
        description: 'Dry run (y/n)'
        required: false
        default: 'n'

jobs:
  content-rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run Content Rewriter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KNOWLEDGE_REPO: ${{ secrets.KNOWLEDGE_REPO }}
          CI: true
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_FILES: ${{ github.event.inputs.max_files || '10' }}
        run: python content_rewriter.py
      
      - name: Summary
        run: |
          echo "✅ Content Rewriter complete."
          echo "All banned organizations (FAO, WHO, UN, World Bank, IMF, etc.) have been scanned and rewritten."
